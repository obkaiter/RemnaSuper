name: RemnaSuper TUI

on:
  push:
    branches: [tui]
  pull_request:
    branches: [tui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            name: debian-12
          - image: debian:13
            name: debian-13
          - image: ubuntu:22.04
            name: ubuntu-22.04
          - image: ubuntu:24.04
            name: ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential cmake pkg-config libncurses-dev libvterm-dev \
            nlohmann-json3-dev ncurses-term python3 python3-pexpect shellcheck
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build and stage
        run: |
          cmake -S . -B "$RUNNER_TEMP/build" -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build "$RUNNER_TEMP/build" --parallel 2
          cmake --install "$RUNNER_TEMP/build" --prefix "$RUNNER_TEMP/tui"
          cp -a lib "$RUNNER_TEMP/tui/"
          cp -a haproxy "$RUNNER_TEMP/tui/"
          cp VERSION "$RUNNER_TEMP/tui/"
          "$RUNNER_TEMP/tui/bin/remnasuper-tui" --self-test
          test "$("$RUNNER_TEMP/tui/bin/remnasuper-tui" --version)" = "$(cat VERSION)"
      - name: Check Bash and Python
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          while IFS= read -r -d '' file; do
            case "$file" in
              RemnaSuper|*.sh) bash -n "$file" ;;
            esac
          done < <(git ls-files -z)
          python3 -m compileall -q haproxy lib
          python3 - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path("tests/fixtures/action-inventory.json").read_text(encoding="utf-8"))
          registry = json.loads(Path("lib/backend/actions.json").read_text(encoding="utf-8"))
          expected = {item["id"]: item for item in inventory["actions"]}
          actual = {item["id"]: item for item in registry["actions"]}
          assert expected.keys() == actual.keys()
          assert len(actual) == len(registry["actions"])
          for key, item in actual.items():
              assert expected[key]["target"] == (item.get("target") or None), key
              assert expected[key]["fields"] == [field["id"] for field in item.get("fields", [])], key
          PY
      - name: Check ShellCheck
        continue-on-error: true
        run: find lib -type f -name '*.sh' -print0 | xargs -0 shellcheck -x RemnaSuper install.sh
      - name: Check HAProxy report formats
        run: |
          PYTHONPATH=haproxy/collector python3 - <<'PY'
          import json
          import subprocess
          import sys
          import tempfile
          from contextlib import closing
          from pathlib import Path

          from database import open_database

          script = Path("haproxy/collector/collector.py").resolve()
          with tempfile.TemporaryDirectory() as path:
              root = Path(path)
              (root / "config").mkdir()
              (root / "database").mkdir()
              (root / "config/config.json").write_text("{}", encoding="utf-8")
              with closing(open_database(root / "database/traffic.sqlite3", write=True)) as database:
                  with database:
                      database.execute("INSERT INTO backends VALUES ('node_a',0,60,'UP',1)")
                      database.execute("INSERT INTO backends VALUES ('node_b',0,60,'DOWN',0)")
                      database.execute("INSERT INTO traffic_intervals VALUES (0,60,'2026-01-01','node_a',7500000,0)")
                      database.execute("INSERT INTO traffic_intervals VALUES (0,60,'2026-01-01','node_b',0,7500000)")
              cmd = [sys.executable, str(script), "--data-root", path]
              report = json.loads(subprocess.check_output([*cmd, "--format", "json", "total"], text=True))
              assert report["v"] == 1
              table = next(part for part in report["sections"] if "rows" in part)
              assert [row[0] for row in table["rows"]] == ["node_a", "node_b", "ИТОГО"]
              assert table["rows"][-1][-1] == "2.00"
              text = subprocess.check_output([*cmd, "total"], text=True)
              assert "ИТОГО" in text and "2.00" in text
          PY
      - name: Check ncurses in a pseudo-terminal
        env:
          TERM: xterm-256color
          LC_ALL: C.UTF-8
        run: |
          python3 - <<'PY'
          import os
          import pexpect

          executable = os.path.join(os.environ["RUNNER_TEMP"], "tui", "bin", "remnasuper-tui")
          child = pexpect.spawn(executable, ["--demo"], encoding="utf-8", dimensions=(28, 100))
          child.expect_exact("Пример задания")
          child.send("\r")
          child.expect_exact("Завершено")
          child.setwinsize(20, 60)
          child.send("\x1b[21~")
          child.expect(pexpect.EOF)
          child.close()
          assert child.exitstatus == 0
          PY
      - name: Check persistent shell and resize
        env:
          TERM: xterm-256color
          LC_ALL: C.UTF-8
          REMNASUPER_SKIP_UPDATE: '1'
          SHELL: /bin/bash
        run: |
          python3 - <<'PY'
          import os
          import pexpect
          import time

          executable = os.path.join(os.environ["RUNNER_TEMP"], "tui", "bin", "remnasuper-tui")
          child = pexpect.spawn(executable, encoding="utf-8", dimensions=(28, 100), timeout=15)
          child.expect_exact("Обзор сервера")
          child.send("\x1b[18~")
          child.expect_exact("Поиск действий")
          child.send("rs_saved_filter")
          child.sendcontrol("o")
          child.sendline("cd /tmp; export RS_TEST=ok; alias rs_test='true'; printf 'TUI_PID:%s\\n' \"$$\"")
          child.expect(r"TUI_PID:(\d+)")
          pid = child.match.group(1)
          child.sendcontrol("o")
          child.expect_exact("Поиск действий")
          child.expect_exact("rs_saved_filter")
          child.setwinsize(24, 80)
          child.sendcontrol("o")
          child.sendline("printf 'TUI_STATE:%s:%s:%s\\n' \"$PWD\" \"$RS_TEST\" \"$$\"; type rs_test")
          child.expect_exact("TUI_STATE:/tmp:ok:" + pid)
          child.expect_exact("rs_test is aliased")
          child.sendline("sleep 30 &")
          child.expect(r"\[1\] \d+")
          child.sendline("fg")
          child.expect_exact("sleep 30")
          time.sleep(0.15)
          child.sendcontrol("z")
          child.expect_exact("Stopped")
          child.sendline("bg; kill %1; wait %1; printf 'JOB_%s\\n' CLEAN")
          child.expect_exact("JOB_CLEAN")
          child.sendline("printf '\\033[?1049hALT_%s' SCREEN; read -r; printf '\\033[?1049l'")
          child.expect_exact("ALT_SCREEN")
          child.sendcontrol("o")
          child.expect_exact("Поиск действий")
          child.sendcontrol("o")
          child.expect_exact("ALT_SCREEN")
          child.send("\r")
          child.sendline("exit")
          child.expect_exact("Поиск действий")
          child.send("\x1b")
          child.send("\x1b[21~")
          child.expect(pexpect.EOF)
          child.close()
          assert child.exitstatus == 0
          PY
      - name: Check side-by-side installation
        if: matrix.name == 'debian-12'
        run: |
          legacy="$RUNNER_TEMP/rs-legacy"
          printf '#!/bin/sh\nprintf "legacy\\n"\n' > "$legacy"
          chmod 755 "$legacy"
          ln -sT "$legacy" /usr/local/bin/rs
          bash install-tui.sh --local "$GITHUB_WORKSPACE"
          test "$(rs)" = legacy
          test "$(rs-tui --version)" = "$(cat VERSION)"
          active="$(readlink /opt/RemnaSuper-tui/current)"
          if bash install-tui.sh --local "$GITHUB_WORKSPACE" --expect-version 0.0.0; then exit 1; fi
          test "$(readlink /opt/RemnaSuper-tui/current)" = "$active"
          test "$(rs)" = legacy
      - name: Check update and rollback
        if: matrix.name == 'debian-12' && github.event_name == 'push'
        run: |
          original="$(readlink /opt/RemnaSuper-tui/current)"
          bash install-tui.sh --expect-version "$(cat VERSION)"
          test "$(readlink /opt/RemnaSuper-tui/current)" != "$original"
          test "$(readlink /opt/RemnaSuper-tui/previous)" = "$original"
          bash /opt/RemnaSuper-tui/current/install-tui.sh --rollback
          test "$(readlink /opt/RemnaSuper-tui/current)" = "$original"
          test "$(rs)" = legacy
      - name: Capture terminal layouts
        if: matrix.name == 'debian-12'
        run: |
          apt-get install -y --no-install-recommends xvfb xauth xterm x11-utils imagemagick fonts-dejavu-core
          mkdir -p "$RUNNER_TEMP/screenshots"
          export TUI_CAPTURE_DIR="$RUNNER_TEMP/screenshots"
          export TUI_CAPTURE_BINARY="$RUNNER_TEMP/tui/bin/remnasuper-tui"
          export REMNASUPER_SKIP_UPDATE=1 LC_ALL=C.UTF-8
          xvfb-run -a -s '-screen 0 1920x1080x24' bash <<'BASH'
          set -e
          for size in 60x20 80x24 100x28 160x48 80x24-mono; do
            term=xterm-256color
            [[ "$size" != *-mono ]] || term=vt100
            xterm -geometry "${size%-mono}" -tn "$term" -T "RemnaSuper $size" \
              -fa 'DejaVu Sans Mono' -fs 11 -e "$TUI_CAPTURE_BINARY" &
            terminal_pid=$!
            for attempt in {1..30}; do
              if xwininfo -name "RemnaSuper $size" >/dev/null 2>&1; then break; fi
              sleep 0.1
            done
            sleep 1
            import -window "RemnaSuper $size" "$TUI_CAPTURE_DIR/$size.png"
            kill "$terminal_pid"
            wait "$terminal_pid" || :
          done
          BASH
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.name == 'debian-12'
        with:
          name: remnasuper-tui-terminal
          path: ${{ runner.temp }}/screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remnasuper-tui-${{ matrix.name }}-amd64
          path: ${{ runner.temp }}/tui
